# Machine-readable hardware landscape — the single source of truth.
#
# Edit THIS file, then run `python scripts/generate_tables.py` to regenerate:
#   - the auto-generated table block in hardware-comparison/README.md
#   - docs/picker/hardware.json (consumed by the interactive picker)
#
# Field reference
#   id             : stable kebab-case key (never reuse)
#   name           : human-readable part name
#   vendor         : NVIDIA | Hailo | Axelera | ...
#   category       : platform | module | card | soc
#   ai_perf        : { value, unit (TOPS/TFLOPS/PetaOPS), precision }
#   power_w        : { min, max } in watts (typical operating envelope)
#   memory         : free-text memory description
#   genai_capable  : true if it can host small LLM/VLM workloads
#   price_usd      : integer USD, or null if not publicly priced
#   best_for       : one-line positioning
#   claim_type     : vendor | independent   (independent = third-party benchmarked)
#   status         : available | samples | eol
#   source_url     : primary source for the headline figure
#   source_date    : YYYY-MM-DD the figure was announced/confirmed
#   last_verified  : YYYY-MM-DD a human last checked this row
#   independent_benchmark: free-text pointer, or null

